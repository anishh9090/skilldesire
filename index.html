<title>Certificate Verification</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #171717;
    background: #fff;
}

header {
    height: 48px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10%;
}

/* Embedded SkillDzire PNG logo — no separate image file required */
.logo-frame {
    position: relative;
    width: 95px;
    height: 40px;
    overflow: hidden;
}

.logo-frame img {
    position: absolute;
    width: 161.5px;
    height: 121.1px;
    max-width: none;
    left: -31.6px;
    top: -47.1px;
    display: block;
}

.login {
    font-size: 14px;
    color: #444;
}

main {
    min-height: 605px;
    text-align: center;
    padding-top: 103px;
}

h1 {
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -2px;
    margin-bottom: 20px;
}

.details {
    font-size: 16px;
    color: #555;
    line-height: 1.8;
}

.details p {
    margin: 12px 0;
}

.details strong {
    font-weight: 700;
}

.valid {
    margin-top: 24px !important;
}

.valid strong {
    color: green;
}

.demo {
    margin-top: 20px;
    font-size: 12px;
    color: #888;
}

footer {
    border-top: 1px solid #e5e5e5;
    height: 160px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 10%;
    color: #888;
    font-size: 14px;
}

@media(max-width: 600px) {
    h1 {
        font-size: 36px;
    }

    main {
        padding: 90px 15px;
    }

    header {
        padding: 0 5%;
    }

    footer {
        padding: 0 5%;
    }
}
</style>
